<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4eddb">
  <title>Wedding Invitation — Md Shahbaz Asgar & Noushin Parveen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="invitation">
    <!-- PAGE 1: exact uploaded reference image -->
    <section id="page1" class="page page--cover" aria-label="Wedding invitation cover">
      <div class="artboard">
        <img src="assets/page-1.png" alt="Wedding invitation cover" draggable="false">
        <!-- Transparent hotspot positioned over the OPEN button in the reference image. -->
        <button id="openButton" class="open-hotspot" type="button"
                aria-label="Open wedding invitation"></button>
      </div>
    </section>

    <!-- PAGE 2: exact uploaded reference image -->
    <section id="page2" class="page page--details" aria-label="Wedding invitation details">
      <div class="artboard">
        <img src="assets/page-2.png" alt="Wedding invitation details" draggable="false">
      </div>
    </section>
  </main>

  <button id="backButton" class="back-button" type="button" aria-label="Back to cover">↑</button>

  <script src="script.js"></script>
</body>
</html>
